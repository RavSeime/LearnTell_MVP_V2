services:
  - type: web
    name: intervjubot-django
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn django_stack.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DATABASE_URL
        fromDatabase:
          name: intervjubot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False

databases:
  - name: intervjubot-db
    databaseName: dbintervju
    user: ravior

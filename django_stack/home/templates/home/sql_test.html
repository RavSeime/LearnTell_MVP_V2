<!DOCTYPE html>
<html lang="en">    

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
</head>
<body>
    <h1>Welcome to the SQL Test page</h1>
    <p>This is a sample Django template.</p>
    <ul>
        {% for user in users %}
            <li>ID {{ user.user_id }}  email {{ user.email }} password {{ user.password }}</li>
        {% empty %}
            <li>No users found.</li>
        {% endfor %}
    </ul>
</body>
</html>

{% extends "home/layout.html" %}
{% block body %}
    <h1>Edit Survey</h1>
    
    <form method="post">
        {% csrf_token %}
        
        <label for="survey_name">Survey Name:</label><br>
        <input type="text" name="survey_name" value="{{ survey.survey_name }}" required><br><br>
        
        <label for="params">Parameters (JSON):</label><br>
        <textarea name="params" rows="15" cols="80" required>{{ params_pretty }}</textarea><br><br>
        
        <button type="submit">Save Changes</button>
        <a href="{% url 'index' %}"><button type="button">Cancel</button></a>
    </form>
{% endblock %}
